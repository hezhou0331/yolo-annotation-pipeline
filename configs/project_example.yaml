# 复制本文件后修改所有REPLACE_ME路径。
# 一个manifest描述一个RGB-D场景；instances中只列“这段场景里实际可见”的实例。

classes:
  0: can
  1: watermelon_rind
  2: meal_box
  3: red_paper_bag
  4: blue_bin
  5: green_bin
  6: red_bin

project:
  scene: ../data/scenes/REPLACE_ME_scene
  output: ../datasets/atec_yolo11_seg
  foundationpose_dir: ../third_party/FoundationPose
  sam2_python: /home/hezhou/miniforge3/envs/yolo11/bin/python
  sam2_model: ../../../models/sam2.1_t.pt
  sam2_device: 0
  sam2_imgsz: 640
  sam2_memory_update_interval: 5
  # 普通SAM2跟踪失败时，用最后可信Mask的光流投影尝试重建记忆；仍会经过IoU/RGB-D质量门控。
  sam2_auto_reregister: true
  sam2_auto_reregister_after_failures: 1
  sam2_min_recovery_seed_iou: 0.35
  sam2_max_flow_shift_norm: 0.35
  split: train
  # 复制/改名场景目录时也不得修改这两个来源ID；同一ID禁止跨train/val。
  capture_session_id: REPLACE_ME_session_01
  source_video_id: REPLACE_ME_session_01_clip_01
  name_prefix: REPLACE_ME_scene_
  image_mode: hardlink
  inference_max_side: 640
  max_consecutive_rejects: 3
  max_instance_overlap: 0.20
  include_review: false
  keep_conflicts: false
  # 正式数据禁止在没有val时偷偷把train当val。只有一次性烟雾测试才改为true。
  allow_val_fallback_for_smoke: false
  no_visualization: false

  # 刚体FoundationPose分支的默认质量阈值。真实样本跑通后再调，不要先放宽。
  quality:
    min_mask_area: 80
    min_area_fraction: 0.00015
    max_area_fraction: 0.65
    min_depth_coverage: 0.45
    max_depth_median_abs_m: 0.05
    max_depth_rmse_m: 0.08
    min_area_ratio: 0.45
    max_area_ratio: 2.20
    max_center_shift_norm: 0.35
    max_translation_jump_m: 0.20
    max_rotation_jump_deg: 55
    min_dominant_component_ratio: 0.75
    min_registration_iou: 0.45

  # 可变形物体逐帧mask分支的默认质量阈值。
  mask_quality:
    min_mask_area: 80
    min_depth_coverage: 0.25
    min_area_ratio: 0.35
    max_area_ratio: 2.80
    max_center_shift_norm: 0.40
    min_dominant_component_ratio: 0.70

instances:
  # 无CAD安全默认：易拉罐先用SAM2打通。准备好尺寸正确的mesh后再切FoundationPose。
  - instance_id: can_01
    class_id: 0
    class_name: can
    tracker: sam2
    key_mask_dir: ../data/key_masks/REPLACE_ME_scene/can_01
    start: 0
    max_frames: 0

  # FoundationPose可选写法（准备好mesh后替换上面的can_01条目）：
  # - instance_id: can_01
  #   class_id: 0
  #   class_name: can
  #   tracker: foundationpose
  #   mesh: ../assets/meshes/can_01/textured_mesh.obj
  #   mesh_unit: m
  #   registration_mask_dir: ../data/key_masks/REPLACE_ME_scene/can_01
  #   start: 0
  #   max_frames: 0

  # 可变形西瓜皮示例：每段首帧人工mask，SAM2传播后再统一质量过滤。
  - instance_id: watermelon_rind_01
    class_id: 1
    class_name: watermelon_rind
    tracker: sam2
    key_mask_dir: ../data/key_masks/REPLACE_ME_scene/watermelon_rind_01
    start: 0
    max_frames: 0

  - instance_id: meal_box_01
    class_id: 2
    class_name: meal_box
    tracker: sam2
    key_mask_dir: ../data/key_masks/REPLACE_ME_scene/meal_box_01
    start: 0
    max_frames: 0

  - instance_id: red_paper_bag_01
    class_id: 3
    class_name: red_paper_bag
    tracker: sam2
    key_mask_dir: ../data/key_masks/REPLACE_ME_scene/red_paper_bag_01
    start: 0
    max_frames: 0

  # 若桶始终在画面中，可按同样方式增加blue_bin_01/green_bin_01/red_bin_01。
  # 同类多实例必须使用不同instance_id，例如can_01、can_02。
